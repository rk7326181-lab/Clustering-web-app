[theme]
primaryColor = "#0B8A7A"
# No 'base' set — toggle Light / Dark via hamburger menu > Settings > Theme

[server]
maxUploadSize = 500
headless = true
# IMPORTANT: do NOT set server.address / server.port here. Streamlit
# Community Cloud manages its own port and reverse-proxy binding, and a
# hardcoded custom port/address in this file can break the Cloud
# deployment outright ("Oh no. Error running app.") — this broke the
# sibling repo (cluster-payout-optimization) when port 8502 was added
# there. For self-hosted/Tailscale deployment, deploy\start.ps1 already
# passes --server.address=0.0.0.0 --server.port=8501 explicitly on the
# command line, which overrides this file — no config.toml change is
# needed or safe for that. See DEPLOYMENT.md.

[browser]
gatherUsageStats = false
